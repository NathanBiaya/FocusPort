{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 fw-bold">Upload to Portfolio</h2>
                    <p class="text-muted text-center mb-4">Add a new masterpiece to your collection.</p>
                    
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-dark btn-lg rounded-pill">
                                <i class="fas fa-cloud-upload-alt me-2"></i>Publish to Live Site
                            </button>
                            <a href="{% url 'gallery_list' %}" class="btn btn-link text-decoration-none text-muted">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Professional Polish */
    body { background-color: #f8f9fa; }
    .card { transition: transform 0.3s ease; }
    .btn-dark { background-color: #1a1a1a; border: none; }
    .btn-dark:hover { background-color: #333; transform: translateY(-2px); }
</style>
{% endblock %}
